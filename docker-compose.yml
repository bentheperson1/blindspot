services:
  api:
    build: .
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - hf_cache:/hf
      - ./backend/firebase-key.json:/code/firebase-key.json:ro

volumes:
  hf_cache: